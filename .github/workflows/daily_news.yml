名称: 每日新闻抓取

触发条件:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

任务:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库代码
        使用: actions/checkout@v4

      - name: 设置 Python 环境
        使用: actions/setup-python@v5
        with:
          Python 版本: '3.11'
          缓存: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - 名称: 执行抓取脚本
        运行: python scraper.py

      - 名称: 备份数据
        运行: cp -r data /tmp/news-data

      - 名称: 同步远程最新代码
        run: |
          git fetch origin main
          git reset --hard origin/main

      - 名称: 恢复数据并提交推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          rm -rf data
          cp -r /tmp/news-data data
          git add -A data/
          git commit -m "自动更新新闻数据：$(date +'%Y-%m-%d')" || echo "无更改"
          git push origin main
