<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven 戚的每日新闻聚合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef2f7 0%, #f5f6f8 200px, #f5f6f8 100%);
    color: #1a1a2e;
    padding: 24px 16px 60px;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }

  /* ============ 顶部标语横幅 ============ */
  .banner {
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    color: #fff;
    padding: 16px 24px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.6;
    box-shadow: 0 4px 20px rgba(37, 99, 235, .25);
    animation: fadeSlideDown .6s cubic-bezier(.22, 1, .36, 1) both;
    display: flex; align-items: center; gap: 12px;
  }
  .banner .emoji { font-size: 20px; flex-shrink: 0; }
  .banner strong { font-weight: 700; }

  /* ============ 头部 ============ */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
    animation: fadeSlideDown .6s cubic-bezier(.22, 1, .36, 1) .05s both;
  }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; }
  .header .meta { font-size: 13px; color: #888; margin-top: 4px; }

  .btn-refresh {
    padding: 10px 20px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 12px rgba(37, 99, 235, .25);
    transition: transform .2s, box-shadow .2s, opacity .2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-refresh:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(37, 99, 235, .35); }
  .btn-refresh:active { transform: translateY(0); }
  .btn-refresh:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .btn-refresh .spinner {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite; display: none;
  }
  .btn-refresh.loading .spinner { display: inline-block; }

  /* ============ 分类栏 ============ */
  .categories {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    padding-bottom: 16px; border-bottom: 1px solid #e5e7eb;
    animation: fadeSlideDown .6s cubic-bezier(.22, 1, .36, 1) .1s both;
  }
  .cat-btn {
    padding: 7px 16px; border-radius: 20px; font-size: 13px;
    border: 1.5px solid #e5e7eb; background: #fff; color: #555;
    cursor: pointer; transition: all .25s cubic-bezier(.22, 1, .36, 1);
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 500;
  }
  .cat-btn:hover {
    border-color: #2563eb; color: #2563eb;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, .12);
  }
  .cat-btn.active {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff; border-color: transparent;
    box-shadow: 0 4px 14px rgba(37, 99, 235, .3);
  }
  .cat-btn .count {
    font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: rgba(37, 99, 235, .1); color: #2563eb; font-weight: 600;
  }
  .cat-btn.active .count { background: rgba(255,255,255,.25); color: #fff; }

  /* ============ 新闻卡片 ============ */
  .article-card {
    background: #fff; border-radius: 12px; padding: 18px 22px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    cursor: pointer;
    transition: transform .25s cubic-bezier(.22, 1, .36, 1),
                box-shadow .25s cubic-bezier(.22, 1, .36, 1);
    animation: cardEnter .5s cubic-bezier(.22, 1, .36, 1) both;
    animation-delay: calc(var(--i, 0) * 0.025s);
    position: relative;
    overflow: hidden;
  }
  .article-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: linear-gradient(180deg, #2563eb, #7c3aed);
    transform: scaleY(0); transform-origin: top;
    transition: transform .3s cubic-bezier(.22, 1, .36, 1);
  }
  .article-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(0,0,0,.08);
  }
  .article-card:hover::before { transform: scaleY(1); }

  .article-title {
    font-size: 15px; font-weight: 600; line-height: 1.55; color: #1a1a2e;
    transition: color .2s;
  }
  .article-card:hover .article-title { color: #2563eb; }

  .article-meta {
    display: flex; gap: 8px; margin-top: 10px;
    font-size: 12px; flex-wrap: wrap; align-items: center;
  }

  /* ✨ 来源标签 —— 蓝色实心底 */
  .src-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 6px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff; font-weight: 600; font-size: 12px;
    box-shadow: 0 2px 6px rgba(37, 99, 235, .25);
  }
  .src-tag::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: #fff; display: inline-block;
    animation: pulse 2s ease-in-out infinite;
  }

  /* ✨ 分类标签 —— 灰底描边，跟来源明显区分 */
  .cat-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 6px;
    background: #f3f4f6; color: #6b7280;
    border: 1px dashed #d1d5db; font-weight: 500; font-size: 12px;
  }
  .cat-tag::before { content: '🏷'; font-size: 11px; }

  .article-time {
    color: #9ca3af; font-size: 12px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .article-time::before { content: '🕐'; font-size: 11px; }

  .article-summary {
    font-size: 13px; color: #555; margin-top: 8px;
    line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  .empty {
    text-align: center; padding: 60px 0; color: #aaa; font-size: 14px;
  }

  /* ============ 详情弹层 ============ */
  .modal-mask {
    display: none; position: fixed; inset: 0;
    background: rgba(15, 23, 42, .55);
    backdrop-filter: blur(4px);
    z-index: 100; padding: 24px; overflow-y: auto;
    opacity: 0; transition: opacity .25s ease;
  }
  .modal-mask.open { display: block; opacity: 1; }
  .modal-mask .modal {
    max-width: 720px; margin: 20px auto;
    background: #fff; border-radius: 16px;
    padding: 36px 44px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    transform: translateY(20px) scale(.97);
    animation: modalIn .35s cubic-bezier(.22, 1, .36, 1) forwards;
  }
  @keyframes modalIn {
    to { transform: translateY(0) scale(1); }
  }
  .modal h2 {
    font-size: 22px; font-weight: 700; line-height: 1.4;
    margin-bottom: 14px; padding-right: 40px;
  }
  .modal .meta {
    font-size: 13px; color: #888; margin-bottom: 22px;
    padding-bottom: 18px; border-bottom: 1px solid #eee;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .modal .content {
    font-size: 15px; line-height: 1.9; color: #333;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .modal .origin-link {
    display: inline-block; margin-top: 28px; padding: 10px 20px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff; text-decoration: none;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(37, 99, 235, .25);
    transition: transform .2s, box-shadow .2s;
  }
  .modal .origin-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(37, 99, 235, .35);
  }
  .modal .close {
    position: absolute; top: 16px; right: 16px;
    background: #f3f4f6; border: none; width: 36px; height: 36px;
    border-radius: 50%; font-size: 18px; cursor: pointer; color: #555;
    transition: background .2s, transform .2s;
  }
  .modal .close:hover { background: #e5e7eb; transform: rotate(90deg); }
  .modal { position: relative; }

  /* ============ 骨架屏 ============ */
  .skeleton {
    background: #fff; border-radius: 12px; padding: 18px 22px;
    margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .sk-line {
    height: 12px; border-radius: 6px; margin-bottom: 10px;
    background: linear-gradient(90deg, #f0f1f3 25%, #e5e7eb 50%, #f0f1f3 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  .sk-line.w60 { width: 60%; }
  .sk-line.w90 { width: 90%; }
  .sk-line.w40 { width: 40%; height: 20px; }

  /* ============ 动画关键帧 ============ */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (max-width: 640px) {
    body { padding: 16px 12px 40px; }
    .header h1 { font-size: 20px; }
    .modal { padding: 24px 20px !important; border-radius: 12px !important; }
    .modal h2 { font-size: 18px; }
    .banner { font-size: 13px; padding: 14px 16px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- 顶部标语横幅 -->
  <div class="banner">
    <span class="emoji">🚀</span>
    <div>这是 <strong>Seven 戚</strong>的一个 <strong>Python</strong> 为主的爬取项目，网站每日不间断更新热点新闻</div>
  </div>

  <div class="header">
    <div>
      <h1>📰 每日新闻聚合</h1>
      <div class="meta" id="lastUpdated">加载中...</div>
    </div>
    <button class="btn-refresh" id="btnRefresh" onclick="loadNews(true)">
      <span class="spinner"></span>
      <span id="btnText">🔄 刷新</span>
    </button>
  </div>

  <div class="categories" id="categories"></div>
  <div id="articleList">
    <div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w90"></div><div class="sk-line w60"></div></div>
    <div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w90"></div><div class="sk-line w60"></div></div>
    <div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w90"></div><div class="sk-line w60"></div></div>
  </div>
</div>

<!-- 详情弹层 -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle"></h2>
    <div class="meta" id="modalMeta"></div>
    <div class="content" id="modalContent"></div>
    <a id="modalOrigin" class="origin-link" target="_blank" rel="noopener">🌐 查看原文</a>
  </div>
</div>

<script>
let allArticles = [];
let currentCategory = '全部';

async function loadNews(manual = false) {
  const btn = document.getElementById('btnRefresh');
  const btnText = document.getElementById('btnText');
  const list = document.getElementById('articleList');

  if (manual) {
    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = '刷新中...';
  }

  try {
    const res = await fetch(`./data/news.json?t=${Date.now()}`);
    const data = await res.json();
    allArticles = data.articles || [];
    document.getElementById('lastUpdated').textContent =
      `最后更新：${data.last_updated} | 原始 ${data.total_raw} 条，去重后 ${data.total_after_dedup} 条`;
    renderCategories();
    renderList();
  } catch (e) {
    list.innerHTML = '<div class="empty">暂无数据，请等待 Actions 生成</div>';
  } finally {
    if (manual) {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = '🔄 刷新';
    }
  }
}

function renderCategories() {
  const counts = {};
  allArticles.forEach(a => {
    const c = a.category || '综合';
    counts[c] = (counts[c] || 0) + 1;
  });
  const cats = ['全部', ...Object.keys(counts).sort()];
  const box = document.getElementById('categories');
  box.innerHTML = cats.map(c => {
    const count = c === '全部' ? allArticles.length : counts[c];
    const active = c === currentCategory ? 'active' : '';
    return `<button class="cat-btn ${active}" onclick="switchCategory('${escapeAttr(c)}')">
      ${escapeHtml(c)}<span class="count">${count}</span>
    </button>`;
  }).join('');
}

function switchCategory(cat) {
  if (cat === currentCategory) return;
  currentCategory = cat;
  renderCategories();
  renderList();
}

function renderList() {
  const list = document.getElementById('articleList');
  const filtered = currentCategory === '全部'
    ? allArticles
    : allArticles.filter(a => (a.category || '综合') === currentCategory);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">该分类暂无新闻</div>';
    return;
  }

  list.innerHTML = filtered.map((a, idx) => {
    const globalIdx = allArticles.indexOf(a);
    return `
      <div class="article-card" style="--i:${idx}" onclick="openModal(${globalIdx})">
        <div class="article-title">${escapeHtml(a.title)}</div>
        <div class="article-meta">
          <span class="src-tag">${escapeHtml(a.source)}</span>
          <span class="cat-tag">${escapeHtml(a.category)}</span>
          <span class="article-time">${escapeHtml(a.published || '')}</span>
        </div>
        ${a.summary ? `<div class="article-summary">${escapeHtml(a.summary)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function openModal(idx) {
  const a = allArticles[idx];
  if (!a) return;

  document.getElementById('modalTitle').textContent = a.title;
  document.getElementById('modalMeta').innerHTML =
    `<span class="src-tag">${escapeHtml(a.source)}</span>
     <span class="cat-tag">${escapeHtml(a.category)}</span>
     <span class="article-time">${escapeHtml(a.published || '')}</span>`;

  const contentEl = document.getElementById('modalContent');
  if (a.content && a.content.trim()) {
    contentEl.textContent = a.content;
  } else if (a.summary) {
    contentEl.textContent = a.summary + '\n\n（正文抓取失败，请点击下方查看原文）';
  } else {
    contentEl.textContent = '（暂无正文，请点击下方查看原文）';
  }

  document.getElementById('modalOrigin').href = a.link || '#';

  const mask = document.getElementById('modalMask');
  mask.classList.add('open');
  document.body.style.overflow = 'hidden';

  // 重置动画
  const modal = mask.querySelector('.modal');
  modal.style.animation = 'none';
  modal.offsetHeight;
  modal.style.animation = '';
}

function closeModal() {
  document.getElementById('modalMask').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escapeAttr(str) {
  if (!str) return '';
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

loadNews(false);
</script>
</body>
</html>
