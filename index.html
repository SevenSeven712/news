<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven 戚的每日新闻聚合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-bg-strong: rgba(255, 255, 255, 0.72);
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.12);
    --glass-shadow-hover: 0 12px 40px rgba(31, 38, 135, 0.18);
    --accent-1: #2563eb;
    --accent-2: #7c3aed;
    --text-1: #1a1a2e;
    --text-2: #555;
    --text-3: #888;
    --blur: 20px;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-1);
    padding: 24px 16px 60px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    background: linear-gradient(135deg, #e8ecf7 0%, #eef1f8 40%, #f2eef9 100%);
  }

  /* 背景光斑 */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
    animation: blobFloat 18s ease-in-out infinite;
  }
  body::before {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(99, 140, 255, .55), transparent 70%);
    top: -120px; left: -120px;
  }
  body::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(180, 120, 255, .5), transparent 70%);
    bottom: -180px; right: -150px;
    animation-delay: -6s;
  }
  .container::before,
  .container::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
    animation: blobFloat 22s ease-in-out infinite;
  }
  .container::before {
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(120, 220, 200, .45), transparent 70%);
    top: 40%; left: -180px;
    animation-delay: -10s;
  }
  .container::after {
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255, 170, 200, .45), transparent 70%);
    top: 15%; right: -140px;
    animation-delay: -3s;
  }

  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, -30px) scale(1.08); }
    66%      { transform: translate(-30px, 30px) scale(0.95); }
  }

  .container {
    max-width: 900px; margin: 0 auto;
    position: relative; z-index: 1;
  }

  /* ============ 通用 SVG 图标 ============ */
  .icon {
    display: inline-block;
    width: 1em; height: 1em;
    vertical-align: -0.125em;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .icon-lg { width: 20px; height: 20px; vertical-align: -0.25em; }
  .icon-sm { width: 12px; height: 12px; vertical-align: -0.1em; }
  .icon-md { width: 14px; height: 14px; vertical-align: -0.15em; }

  /* ============ 顶部标语 ============ */
  .banner {
    background: linear-gradient(135deg, rgba(99, 130, 255, 0.55) 0%, rgba(160, 110, 255, 0.5) 100%);
    backdrop-filter: blur(var(--blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
    color: #fff; padding: 16px 24px; border-radius: 18px;
    margin-bottom: 20px; font-size: 14px; line-height: 1.6;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
      0 8px 32px rgba(80, 100, 220, .25),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
    display: flex; align-items: center; gap: 12px;
    animation: fadeSlideDown .6s cubic-bezier(.22,1,.36,1) both;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .banner .banner-icon {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.35);
    flex-shrink: 0;
  }
  .banner .banner-icon svg { width: 18px; height: 18px; }

  /* ============ 头部 ============ */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
    animation: fadeSlideDown .6s cubic-bezier(.22,1,.36,1) .05s both;
  }
  .header h1 {
    font-size: 24px; font-weight: 800; letter-spacing: -.3px;
    color: var(--text-1);
    display: inline-flex; align-items: center; gap: 10px;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  .header h1 svg {
    width: 26px; height: 26px; color: var(--accent-1);
  }
  .header .meta { font-size: 13px; color: var(--text-3); margin-top: 6px; }

  /* ============ 刷新按钮 ============ */
  .btn-refresh {
    padding: 11px 22px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(235,240,255,0.7));
    color: var(--accent-1);
    font-size: 14px; font-weight: 700; cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      4px 4px 10px rgba(120, 130, 180, 0.22),
      -4px -4px 10px rgba(255, 255, 255, 0.95),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    transition: all .25s cubic-bezier(.22,1,.36,1);
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .btn-refresh .btn-icon { width: 16px; height: 16px; }
  .btn-refresh:hover {
    transform: translateY(-2px);
    color: var(--accent-2);
    box-shadow:
      6px 6px 14px rgba(120, 130, 180, 0.28),
      -6px -6px 14px rgba(255, 255, 255, 1),
      inset 0 1px 0 rgba(255, 255, 255, 1);
  }
  .btn-refresh:active {
    transform: translateY(0);
    box-shadow:
      inset 4px 4px 10px rgba(120, 130, 180, 0.25),
      inset -4px -4px 10px rgba(255, 255, 255, 0.9);
  }
  .btn-refresh:disabled { opacity: .55; cursor: not-allowed; transform: none; }
  .btn-refresh .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(37, 99, 235, .25);
    border-top-color: var(--accent-1); border-radius: 50%;
    animation: spin .7s linear infinite; display: none;
  }
  .btn-refresh.loading .spinner { display: inline-block; }
  .btn-refresh.loading .btn-icon { display: none; }

  /* ============ 分类栏 ============ */
  .categories {
    display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
    padding: 14px 16px;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
    border-radius: 18px;
    border: 1px solid var(--glass-border);
    box-shadow:
      var(--glass-shadow),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    animation: fadeSlideDown .6s cubic-bezier(.22,1,.36,1) .1s both;
    min-height: 40px;
  }
  .cat-btn {
    padding: 8px 16px; border-radius: 12px; font-size: 13px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.55);
    color: var(--text-2);
    cursor: pointer; transition: all .25s cubic-bezier(.22,1,.36,1);
    display: inline-flex; align-items: center; gap: 6px; font-weight: 600;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow:
      2px 2px 6px rgba(120, 130, 180, 0.15),
      -2px -2px 6px rgba(255, 255, 255, 0.9);
  }
  .cat-btn:hover {
    color: var(--accent-1);
    transform: translateY(-1px);
    box-shadow:
      3px 3px 10px rgba(120, 130, 180, 0.22),
      -3px -3px 10px rgba(255, 255, 255, 1);
  }
  .cat-btn.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff; border-color: rgba(255,255,255,0.3);
    box-shadow:
      4px 4px 12px rgba(80, 100, 220, 0.4),
      -2px -2px 8px rgba(255, 255, 255, 0.7),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .cat-btn .count {
    font-size: 11px; padding: 1px 7px; border-radius: 8px;
    background: rgba(37, 99, 235, .12);
    color: var(--accent-1); font-weight: 700;
  }
  .cat-btn.active .count {
    background: rgba(255, 255, 255, .3); color: #fff;
  }

  /* ============ 新闻卡片 ============ */
  .article-card {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
    border-radius: 18px; padding: 18px 22px;
    margin-bottom: 12px;
    border: 1px solid var(--glass-border);
    box-shadow:
      var(--glass-shadow),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    cursor: pointer;
    transition: transform .3s cubic-bezier(.22,1,.36,1),
                box-shadow .3s cubic-bezier(.22,1,.36,1),
                background .3s;
    animation: cardEnter .55s cubic-bezier(.22,1,.36,1) both;
    animation-delay: calc(var(--i, 0) * 0.025s);
    position: relative; overflow: hidden;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .article-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--accent-1), var(--accent-2));
    transform: scaleY(0); transform-origin: top;
    transition: transform .35s cubic-bezier(.22,1,.36,1);
    border-radius: 0 3px 3px 0;
  }
  .article-card:hover {
    transform: translateY(-4px);
    background: var(--glass-bg-strong);
    box-shadow:
      var(--glass-shadow-hover),
      inset 0 1px 0 rgba(255, 255, 255, 1);
  }
  .article-card:hover::before { transform: scaleY(1); }

  .article-thumb {
    width: 100px; height: 72px; flex-shrink: 0;
    border-radius: 10px; object-fit: cover;
    background: rgba(255,255,255,0.4);
    box-shadow:
      2px 2px 8px rgba(120, 130, 180, 0.2),
      inset 0 0 0 1px rgba(255,255,255,0.5);
  }
  .article-body { flex: 1; min-width: 0; }
  .article-title {
    font-size: 15px; font-weight: 700; line-height: 1.55;
    color: var(--text-1); transition: color .25s;
  }
  .article-card:hover .article-title { color: var(--accent-1); }
  .article-meta {
    display: flex; gap: 8px; margin-top: 10px;
    font-size: 12px; flex-wrap: wrap; align-items: center;
  }

  /* 来源标签 */
  .src-tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 11px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff; font-weight: 700; font-size: 12px;
    box-shadow:
      2px 2px 8px rgba(80, 100, 220, 0.35),
      inset 0 1px 0 rgba(255,255,255,0.35);
    cursor: pointer; transition: all .25s;
    text-decoration: none;
  }
  .src-tag:hover {
    transform: translateY(-1px);
    box-shadow:
      4px 4px 14px rgba(80, 100, 220, 0.5),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .src-tag .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #fff; display: inline-block;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 6px rgba(255,255,255,0.9);
  }

  /* 分类标签 */
  .cat-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 11px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.55);
    color: var(--text-2);
    border: 1px dashed rgba(120, 130, 180, 0.35);
    font-weight: 600; font-size: 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .cat-tag svg { width: 11px; height: 11px; color: var(--text-3); }

  .article-time {
    color: var(--text-3); font-size: 12px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .article-time svg { width: 11px; height: 11px; }

  .article-summary {
    font-size: 13px; color: var(--text-2); margin-top: 8px;
    line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  .empty {
    text-align: center; padding: 60px 0; color: #aaa; font-size: 14px;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border-radius: 18px;
    border: 1px solid var(--glass-border);
  }

  /* ============ 返回按钮 ============ */
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; margin-bottom: 20px;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--accent-1); text-decoration: none;
    font-size: 13px; font-weight: 700;
    box-shadow:
      3px 3px 10px rgba(120, 130, 180, 0.18),
      -3px -3px 10px rgba(255, 255, 255, 0.9);
    transition: all .25s cubic-bezier(.22,1,.36,1);
  }
  .back-btn svg { width: 14px; height: 14px; }
  .back-btn:hover {
    transform: translateX(-3px);
    color: var(--accent-2);
    box-shadow:
      5px 5px 14px rgba(120, 130, 180, 0.25),
      -5px -5px 14px rgba(255, 255, 255, 1);
  }

  /* ============ 详情页 ============ */
  .detail {
    background: var(--glass-bg-strong);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-radius: 22px; padding: 38px 46px;
    border: 1px solid var(--glass-border);
    box-shadow:
      0 20px 60px rgba(31, 38, 135, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    animation: fadeSlideDown .5s cubic-bezier(.22,1,.36,1) both;
  }
  .detail h1 {
    font-size: 26px; font-weight: 800; line-height: 1.4;
    margin-bottom: 16px; letter-spacing: -.3px;
    color: var(--text-1);
  }
  .detail .meta {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    font-size: 13px; color: var(--text-3); margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(120, 130, 180, 0.15);
  }
  .detail-cover {
    width: 100%; max-height: 400px; object-fit: cover;
    border-radius: 14px; margin-bottom: 24px;
    background: rgba(255,255,255,0.4);
    box-shadow: 0 8px 28px rgba(31, 38, 135, 0.15);
  }
  .detail-content {
    font-size: 16px; line-height: 1.9; color: #333;
    word-wrap: break-word;
  }
  .detail-content p { margin-bottom: 16px; }
  .detail-content .inline-img {
    width: 100%; border-radius: 12px; margin: 16px 0;
    background: rgba(255,255,255,0.4);
    box-shadow: 0 6px 20px rgba(31, 38, 135, 0.12);
  }
  .origin-link {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 28px; padding: 13px 24px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff; text-decoration: none;
    border-radius: 12px; font-size: 14px; font-weight: 700;
    box-shadow:
      4px 4px 14px rgba(80, 100, 220, 0.35),
      inset 0 1px 0 rgba(255,255,255,0.4);
    transition: all .25s cubic-bezier(.22,1,.36,1);
  }
  .origin-link svg { width: 16px; height: 16px; }
  .origin-link:hover {
    transform: translateY(-2px);
    box-shadow:
      6px 6px 20px rgba(80, 100, 220, 0.5),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }

  /* ============ 来源页头部 ============ */
  .source-header {
    background: linear-gradient(135deg,
      rgba(99, 130, 255, 0.65) 0%,
      rgba(160, 110, 255, 0.6) 100%);
    backdrop-filter: blur(var(--blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
    color: #fff; padding: 26px 30px; border-radius: 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow:
      0 12px 40px rgba(80, 100, 220, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
    animation: fadeSlideDown .5s cubic-bezier(.22,1,.36,1) both;
  }
  .source-header h1 {
    font-size: 22px; font-weight: 800; margin-bottom: 6px;
    display: inline-flex; align-items: center; gap: 10px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .source-header h1 svg { width: 22px; height: 22px; }
  .source-header .meta { font-size: 13px; opacity: .92; }

  /* ============ 日期筛选 ============ */
  .date-filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .date-btn {
    padding: 7px 16px; border-radius: 12px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.55);
    color: var(--text-2);
    cursor: pointer; font-weight: 700;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow:
      2px 2px 6px rgba(120, 130, 180, 0.15),
      -2px -2px 6px rgba(255, 255, 255, 0.9);
    transition: all .25s cubic-bezier(.22,1,.36,1);
  }
  .date-btn:hover {
    color: var(--accent-1);
    transform: translateY(-1px);
  }
  .date-btn.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff; border-color: rgba(255,255,255,0.3);
    box-shadow:
      4px 4px 12px rgba(80, 100, 220, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }

  /* ============ 骨架屏 ============ */
  .sk-line {
    height: 12px; border-radius: 6px; margin-bottom: 10px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.4) 25%,
      rgba(200,210,240,0.5) 50%,
      rgba(255,255,255,0.4) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  .sk-line.w40 { width: 40%; height: 20px; }
  .sk-line.w60 { width: 60%; }
  .sk-line.w90 { width: 90%; }
  .sk-line.w95 { width: 95%; }
  .sk-line.w100 { width: 100%; }
  .sk-line.w88 { width: 88%; }
  .sk-line.w75 { width: 75%; }

  .skeleton {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border-radius: 18px; padding: 18px 22px;
    margin-bottom: 12px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }

  .detail-skeleton { padding: 8px 0; }
  .detail-skeleton .sk-line {
    height: 14px; border-radius: 7px; margin-bottom: 14px;
  }

  /* ============ 动画 ============ */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .35; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ============ 移动端 ============ */
  @media (max-width: 640px) {
    body { padding: 16px 12px 40px; }
    .header h1 { font-size: 20px; }
    .header h1 svg { width: 22px; height: 22px; }
    .banner { font-size: 13px; padding: 14px 16px; }
    .detail { padding: 24px 20px; border-radius: 16px; }
    .detail h1 { font-size: 20px; }
    .source-header { padding: 18px 20px; }
    .source-header h1 { font-size: 18px; }
    .article-thumb { width: 80px; height: 60px; }
    .categories { padding: 12px; gap: 8px; }
  }

  @supports not (backdrop-filter: blur(1px)) {
    .article-card,
    .categories,
    .banner,
    .source-header,
    .detail,
    .back-btn {
      background: rgba(255, 255, 255, 0.85);
    }
    .banner, .source-header {
      background: linear-gradient(135deg, #6b84ff, #9b6bff);
    }
  }
</style>
</head>
<body>
<div class="container">

  <div id="homePage">
    <div class="banner">
      <span class="banner-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
      </span>
      <div>这是 <strong>Seven 戚</strong>的一个以 <strong>Python</strong> 为主的爬取项目，网站每日不间断更新热点新闻</div>
    </div>

    <div class="header">
      <div>
        <h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
            <path d="M18 14h-8"/>
            <path d="M15 18h-5"/>
            <path d="M10 6h8v4h-8V6Z"/>
          </svg>
          每日新闻聚合
        </h1>
        <div class="meta" id="lastUpdated">正在加载...</div>
      </div>
      <button class="btn-refresh" id="btnRefresh" onclick="loadNews(true)">
        <span class="spinner"></span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
        <span id="btnText">刷新</span>
      </button>
    </div>

    <div class="categories" id="categories"></div>

    <div id="articleList">
      <div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w90"></div><div class="sk-line w60"></div></div>
      <div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w90"></div><div class="sk-line w60"></div></div>
      <div class="skeleton"><div class="sk-line w40"></div><div class="sk-line w90"></div><div class="sk-line w60"></div></div>
    </div>
  </div>

  <div id="sourcePage" style="display:none"></div>
  <div id="articlePage" style="display:none"></div>

</div>

<script>
// ============ SVG 图标字符串（复用） ============
const SVG = {
  tag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor" stroke="none"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  antenna: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>`,
  globe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
  arrowLeft: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`,
};

let allArticles = [];
let meta = { last_updated: '', total_raw: 0, total_after_dedup: 0 };
let currentCategory = '全部';
let currentSource = '';
let currentDateFilter = 'today';
let contentsCache = null;
let contentsPromise = null;

loadNews();

async function loadNews(manual = false) {
  const btn = document.getElementById('btnRefresh');
  const btnText = document.getElementById('btnText');
  const listEl = document.getElementById('articleList');
  const metaEl = document.getElementById('lastUpdated');

  if (manual && btn) {
    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = '刷新中...';
  }

  try {
    const res = await fetch(`./data/news.json?t=${Date.now()}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allArticles = data.articles || [];
    meta = {
      last_updated: data.last_updated || '',
      total_raw: data.total_raw || 0,
      total_after_dedup: data.total_after_dedup || 0,
    };
    contentsCache = null;
    try { localStorage.removeItem('news_contents'); } catch (e) {}
    fillHomeUI();
  } catch (e) {
    console.error('加载失败:', e);
    if (listEl) listEl.innerHTML =
      `<div class="empty">数据加载失败：${escapeHtml(String(e.message || e))}<br>
       <small style="color:#bbb;font-size:12px;margin-top:8px;display:block;">
       请稍后再试，或前往 GitHub Actions 手动触发一次抓取
       </small></div>`;
    if (metaEl) metaEl.textContent = '数据加载失败';
  } finally {
    if (manual && btn) {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = '刷新';
    }
  }
}

function fillHomeUI() {
  const metaEl = document.getElementById('lastUpdated');
  if (metaEl) {
    metaEl.textContent = meta.last_updated
      ? `最后更新：${meta.last_updated} | 原始 ${meta.total_raw} 条，去重后 ${meta.total_after_dedup} 条`
      : '暂无数据';
  }
  renderCategoriesUI();
  renderArticleListUI();
}

function renderCategoriesUI() {
  const box = document.getElementById('categories');
  if (!box) return;
  const counts = {};
  allArticles.forEach(a => {
    const c = a.category || '综合';
    counts[c] = (counts[c] || 0) + 1;
  });
  const order = ['科技', '技术', '财经', '社会', '热搜', '娱乐', '游戏', '阅读', '综合'];
  const allCats = Object.keys(counts);
  const sorted = order.filter(c => allCats.includes(c))
    .concat(allCats.filter(c => !order.includes(c)).sort());
  const cats = [
    { name: '全部', count: allArticles.length },
    ...sorted.map(c => ({ name: c, count: counts[c] })),
  ];
  box.innerHTML = cats.map(c => `
    <button class="cat-btn ${c.name === currentCategory ? 'active' : ''}"
            onclick="switchCategory('${escapeAttr(c.name)}')">
      ${escapeHtml(c.name)}<span class="count">${c.count}</span>
    </button>
  `).join('');
}

function switchCategory(cat) {
  if (cat === currentCategory) return;
  currentCategory = cat;
  renderCategoriesUI();
  renderArticleListUI();
}

function renderArticleListUI() {
  const list = document.getElementById('articleList');
  if (!list) return;
  const filtered = currentCategory === '全部'
    ? allArticles
    : allArticles.filter(a => (a.category || '综合') === currentCategory);
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">该分类暂无新闻</div>';
    return;
  }
  list.innerHTML = renderArticles(filtered, true);
}

function renderArticles(list, showSourceTag) {
  return list.map((a, idx) => `
    <div class="article-card" style="--i:${idx}"
         onclick="location.hash='#/article/${encodeURIComponent(a.id)}'">
      ${a.cover
        ? `<img class="article-thumb" src="${escapeHtml(a.cover)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none'">`
        : ''}
      <div class="article-body">
        <div class="article-title">${escapeHtml(a.title)}</div>
        <div class="article-meta">
          ${showSourceTag
            ? `<a class="src-tag" href="#/source/${encodeURIComponent(a.source)}"
                 onclick="event.stopPropagation()">
                 <span class="dot"></span>${escapeHtml(a.source)}
               </a>`
            : ''}
          <span class="cat-tag">${SVG.tag}${escapeHtml(a.category)}</span>
          <span class="article-time">${SVG.clock}${escapeHtml(a.published || '')}</span>
        </div>
        ${a.summary ? `<div class="article-summary">${escapeHtml(a.summary)}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const home = document.getElementById('homePage');
  const sourcePage = document.getElementById('sourcePage');
  const articlePage = document.getElementById('articlePage');

  if (hash.startsWith('/article/')) {
    home.style.display = 'none';
    sourcePage.style.display = 'none';
    articlePage.style.display = 'block';
    showArticle(hash.slice(9));
  } else if (hash.startsWith('/source/')) {
    home.style.display = 'none';
    sourcePage.style.display = 'block';
    articlePage.style.display = 'none';
    currentSource = hash.slice(8);
    currentDateFilter = 'today';
    renderSourcePage();
  } else {
    home.style.display = 'block';
    sourcePage.style.display = 'none';
    articlePage.style.display = 'none';
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

function renderSourcePage() {
  const el = document.getElementById('sourcePage');
  const sourceArticles = allArticles.filter(a => a.source === currentSource);
  const filtered = filterByDate(sourceArticles, currentDateFilter);

  el.innerHTML = `
    <a class="back-btn" href="#/">${SVG.arrowLeft}返回首页</a>
    <div class="source-header">
      <h1>${SVG.antenna}${escapeHtml(currentSource)}</h1>
      <div class="meta">共 ${sourceArticles.length} 条新闻 · 当前显示 ${filtered.length} 条</div>
    </div>
    <div class="date-filters">
      ${[
        { key: 'today', label: '今天' },
        { key: '3d', label: '近 3 天' },
        { key: '7d', label: '近 7 天' },
        { key: 'all', label: '全部' },
      ].map(f => `
        <button class="date-btn ${f.key === currentDateFilter ? 'active' : ''}"
                onclick="setDateFilter('${f.key}')">${f.label}</button>
      `).join('')}
    </div>
    <div>
      ${filtered.length === 0
        ? '<div class="empty">该时间段内暂无新闻</div>'
        : renderArticles(filtered, false)}
    </div>
  `;
}

function setDateFilter(f) {
  currentDateFilter = f;
  renderSourcePage();
}

async function showArticle(id) {
  const el = document.getElementById('articlePage');
  const art = allArticles.find(a => a.id === id);

  if (!art) {
    el.innerHTML = `
      <a class="back-btn" href="#/">${SVG.arrowLeft}返回首页</a>
      <div class="empty">未找到这篇文章</div>
    `;
    return;
  }

  el.innerHTML = `
    <a class="back-btn" href="#/">${SVG.arrowLeft}返回首页</a>
    <article class="detail">
      <h1>${escapeHtml(art.title)}</h1>
      <div class="meta">
        <a class="src-tag" href="#/source/${encodeURIComponent(art.source)}">
          <span class="dot"></span>${escapeHtml(art.source)}
        </a>
        <span class="cat-tag">${SVG.tag}${escapeHtml(art.category)}</span>
        <span class="article-time">${SVG.clock}${escapeHtml(art.published || '')}</span>
      </div>
      ${art.cover ? `<img class="detail-cover" src="${escapeHtml(art.cover)}" referrerpolicy="no-referrer" loading="eager" onerror="this.style.display='none'">` : ''}
      <div class="detail-content" id="detailContent">
        <div class="detail-skeleton">
          <div class="sk-line w40"></div>
          <div class="sk-line w100"></div>
          <div class="sk-line w95"></div>
          <div class="sk-line w100"></div>
          <div class="sk-line w88"></div>
          <div class="sk-line w100"></div>
          <div class="sk-line w75"></div>
          <div class="sk-line w100"></div>
          <div class="sk-line w60"></div>
        </div>
      </div>
      <a class="origin-link" href="${escapeHtml(art.link || '#')}" target="_blank" rel="noopener">${SVG.globe}查看原文</a>
    </article>
  `;

  const content = await getContent(id);
  const c = document.getElementById('detailContent');
  if (!c) return;

  if (!content || (!content.content && (!content.images || !content.images.length))) {
    c.innerHTML = `<p>${escapeHtml(art.summary || '暂无正文')}</p>
      <p style="color:#999;font-size:13px;margin-top:12px;">（正文抓取失败，请点击下方查看原文）</p>`;
    return;
  }

  let html = '';
  if (content.images && content.images.length) {
    html += content.images.slice(0, 3).map(u =>
      `<img class="inline-img" src="${escapeHtml(u)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">`
    ).join('');
  }
  if (content.content) {
    const paras = content.content.split(/\n+/).filter(p => p.trim());
    html += paras.map(p => `<p>${escapeHtml(p)}</p>`).join('');
  } else {
    html += `<p>${escapeHtml(art.summary || '暂无正文')}</p>`;
  }
  c.innerHTML = html;
}

async function loadContents() {
  if (contentsCache) return contentsCache;
  try {
    const cached = localStorage.getItem('news_contents');
    if (cached) {
      const obj = JSON.parse(cached);
      if (Date.now() - obj.ts < 6 * 3600 * 1000) {
        contentsCache = obj.data;
        return contentsCache;
      }
    }
  } catch (e) {}
  if (contentsPromise) return contentsPromise;
  contentsPromise = fetch(`./data/contents.json?t=${Date.now()}`)
    .then(r => r.json())
    .then(data => {
      contentsCache = data;
      try { localStorage.setItem('news_contents', JSON.stringify({ data, ts: Date.now() })); } catch (e) {}
      return data;
    })
    .finally(() => { contentsPromise = null; });
  return contentsPromise;
}

async function getContent(id) {
  try {
    const contents = await loadContents();
    return contents[id] || null;
  } catch (e) { return null; }
}

function filterByDate(articles, mode) {
  if (mode === 'all') return articles;
  const now = new Date();
  if (mode === 'today') {
    const todayStr = formatDate(now);
    return articles.filter(a => (a.published || '').startsWith(todayStr));
  }
  const days = mode === '3d' ? 3 : 7;
  const cutoff = new Date(now.getTime() - days * 86400000);
  return articles.filter(a => {
    const d = parseDate(a.published);
    return d && d >= cutoff;
  });
}
function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseDate(str) {
  if (!str) return null;
  const m = str.match(/(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0));
}
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escapeAttr(str) {
  if (!str) return '';
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

route();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && location.hash) location.hash = '';
});
</script>
</body>
</html>
